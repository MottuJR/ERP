services:
  postgres:
    image: postgres:16-alpine
    container_name: panaderia-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panaderia_erp}
      POSTGRES_USER: ${POSTGRES_USER:-panaderia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panaderia_dev_pw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panaderia} -d ${POSTGRES_DB:-panaderia_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
