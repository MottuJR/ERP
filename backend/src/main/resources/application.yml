spring:
  application:
    name: erp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    expiration-minutes: 60
  stock:
    # Poner en false para pruebas: permite que una venta o producción deje el stock en negativo
    # en vez de rechazar la operación. Volver a true antes de producción.
    validar-disponibilidad: false
